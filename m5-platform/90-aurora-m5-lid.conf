# MacBook Pro (M5 Pro, J714s), aurora-m5-platform-config: closing the lid is
# deep sleep on battery, on AC and docked. While Plasma (PowerDevil) or GNOME
# runs, the desktop handles the lid with its own settings instead.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
