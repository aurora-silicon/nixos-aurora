name: Native Aurora NixOS images
on:
  workflow_dispatch:
    inputs:
      desktop:
        type: choice
        options: [minimal, kde, gnome]
        default: minimal
      channel:
        description: Update channel /etc/nixos follows (its flake.lock pins this build's commit either way)
        type: choice
        options: [testing, stable, pinned]
        default: testing
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            extra-substituters = https://aurorasilicon.org/nixos-aurora/cache
            extra-trusted-public-keys = aurora-nixos-1:ZxmPNEWsrzgXai+W+dlTE8cachb1xaatfXKK8X8go14=
      # Kernel-derived tools (cpupower and others) are not in the Aurora cache
      # and need the kernel archive; take every pinned archive from the source
      # cache (or codeload with Retry-After backoff), verified against
      # sources.json, instead of fetchurl's three quick retries.
      - name: Fetch pinned sources with verification and rate-limit backoff
        run: python3 scripts/prefetch-sources.py
      - name: Build the pinned system and installer closures
        env:
          DESKTOP: ${{ inputs.desktop }}
        run: |
          nix build --cores 4 --max-jobs 2 --print-build-logs --out-link system ".#nixosConfigurations.aurora-$DESKTOP.config.system.build.toplevel"
          nix build --out-link installer ".#nixosConfigurations.aurora-$DESKTOP.config.system.build.nixos-install"
          nix build --out-link aura .#aura
          nix build --out-link grub ".#nixosConfigurations.aurora-$DESKTOP.pkgs.grub2_efi"
          # The Stage 2 installed systems refresh on rebuild, checked for the
          # same aura, the MacBook Neo's device tree and one U-Boot member.
          nix build --print-build-logs --out-link stage2 .#checks.aarch64-linux.stage2
          nix store verify --recursive ./system ./installer ./aura ./grub ./stage2
      - name: Assemble the installer filesystem bundle
        env:
          DESKTOP: ${{ inputs.desktop }}
          AURORA_UPDATE_CHANNEL: ${{ inputs.channel || 'testing' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs e2fsprogs dosfstools fdisk zstd
          sudo env PATH="$PATH" AURORA_UPDATE_CHANNEL="$AURORA_UPDATE_CHANNEL" bash scripts/build-image "$DESKTOP" "$(readlink -f system)" "$(readlink -f installer)" "$(readlink -f aura)" "$(readlink -f grub)" 2>&1 | tee image-build.log
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: success()
        with:
          subject-path: out/*-filesystems.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nixos-${{ inputs.desktop }}-candidate
          compression-level: 0
          path: |
            image-build.log
            out/*-filesystems.tar.zst*
            out/*-installer/image.json
            out/*-installer/closure.json
          retention-days: 14
