name: Publish signed Neo Reset QA payload
on:
  workflow_dispatch:
    inputs:
      image-run:
        description: Successful exact-source KDE image run
        required: true
permissions:
  contents: write
  actions: read
jobs:
  delivery:
    uses: aurora-silicon/aurora-distributions/.github/workflows/build-payload.yml@2ed6d3df9ba223fcfd34cd49259723a474e7118d
    with:
      profile: nixos-kde
      image-run: ${{ inputs.image-run }}
      neo-reset-qa: true
    secrets:
      catalog-signing-key: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY }}
