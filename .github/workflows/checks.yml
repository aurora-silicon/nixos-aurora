name: Aurora NixOS checks and builds
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated hardware outputs; empty builds all
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  evaluate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://aurorasilicon.org/nixos-aurora/cache
            extra-trusted-public-keys = aurora-nixos-1:ZxmPNEWsrzgXai+W+dlTE8cachb1xaatfXKK8X8go14=
      - name: Run Python, cache signature and Stage 2 tests
        run: nix shell --inputs-from . nixpkgs#openssl nixpkgs#dtc -c python3 -m unittest discover -s tests
      - name: Exercise offline Nix cache signing and channel assembly
        run: nix shell --inputs-from . nixpkgs#openssl -c python3 -m unittest discover -s tests/integration
      - name: Lint Nix expressions
        run: nix build --no-link --print-build-logs .#checks.aarch64-linux.statix .#checks.aarch64-linux.deadnix
      - name: Check option documentation
        run: nix build --out-link result-docs --print-build-logs .#checks.aarch64-linux.documentation
      - name: Upload option reference and metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aurora-documentation
          path: result-docs/share/doc/aurora/
          if-no-files-found: error
          retention-days: 30
      - id: plan
        name: Select changed derivations from committed Git flakes
        run: python3 scripts/ci-plan.py >> "$GITHUB_OUTPUT"
      - name: Evaluate all profiles and hardware packages
        run: |
          nix flake check --no-build
          nix build --no-link .#checks.aarch64-linux.profiles .#checks.aarch64-linux.plymouth-initrd .#checks.aarch64-linux.firstboot-image .#checks.aarch64-linux.sep-kernel-transition \
            .#checks.aarch64-linux.stage2-tools .#checks.aarch64-linux.stage2-trial .#checks.aarch64-linux.fedora-parity .#checks.aarch64-linux.ane-packaging \
            .#checks.aarch64-linux.legacy-speaker-protection .#checks.aarch64-linux.speakerguardd-v2-opt-in .#checks.aarch64-linux.sep-luks .#checks.aarch64-linux.secure-boot \
            .#checks.aarch64-linux.userpages .#checks.aarch64-linux.module-composition \
            .#checks.aarch64-linux.kernel-overrides .#checks.aarch64-linux.bootloader-overrides .#checks.aarch64-linux.package-overrides \
            .#checks.aarch64-linux.peripheral-firmware
      - name: Inspect KDE graphical login configuration
        run: |
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.defaultUnit
          nix eval --json .#nixosConfigurations.aurora-kde.config.services.displayManager.plasma-login-manager.enable
          nix eval --json .#nixosConfigurations.aurora-kde.config.services.displayManager.sddm.enable
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.services.plasmalogin.aliases
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.services.plasmalogin.wantedBy
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.services.plasmalogin.after
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.services.plasmalogin.requires
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.services.plasmalogin.unitConfig.ConditionPathExists
          nix eval --json .#nixosConfigurations.aurora-kde.config.boot.blacklistedKernelModules
          grep -Fx 'options apple_sep xart_writes=1 provision_keybag=1' \
            "$(nix eval --raw '.#nixosConfigurations.aurora-kde.config.environment.etc."modprobe.d/aurora-sep-defaults.conf".source')"
          nix eval --json .#nixosConfigurations.aurora-kde.config.boot.initrd.availableKernelModules
  steam-packaging:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://aurorasilicon.org/nixos-aurora/cache
            extra-trusted-public-keys = aurora-nixos-1:ZxmPNEWsrzgXai+W+dlTE8cachb1xaatfXKK8X8go14=
      - name: Exercise installed Steam and Proton launchers in a NixOS VM
        run: nix build --no-link --print-build-logs --max-jobs 2 --cores 4 .#checks.aarch64-linux.steam-packaging
  documentation:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Build option browser
        run: nix build --out-link result-docs-site --print-build-logs .#checks.aarch64-linux.documentation-site
      - name: Upload option browser preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aurora-documentation-site
          path: result-docs-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  lifecycle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [fex-overlay-upgrade, firstboot-rekey, sep-lifecycle]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix build --no-link --print-build-logs '.#checks.aarch64-linux.${{ matrix.check }}'
  hardware:
    needs: evaluate
    if: needs.evaluate.outputs.packages != '[]'
    # Guest drivers contain x86 code and must be built on x86, as on Fedora.
    runs-on: ${{ matrix.package == 'fex-mesa' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    # Firefox takes hours on the 4-core runner.
    timeout-minutes: ${{ matrix.package == 'firefox' && 355 || 180 }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.evaluate.outputs.packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-experimental-features = auto-allocate-uids cgroups
            auto-allocate-uids = true
            use-cgroups = true
            extra-system-features = uid-range
            extra-substituters = https://aurorasilicon.org/nixos-aurora/cache
            extra-trusted-public-keys = aurora-nixos-1:ZxmPNEWsrzgXai+W+dlTE8cachb1xaatfXKK8X8go14=
      - name: Check isolated Flatpak build namespaces before fetching SDKs
        if: matrix.package == 'flatpak-gl'
        run: nix build --no-link --print-build-logs .#checks.aarch64-linux.flatpak-sandbox
      - name: Prepare build capacity for Firefox
        if: matrix.package == 'firefox'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost /opt/hostedtoolcache /usr/local/.ghcup || true
          # gkrust's rustc needs >10 GB next to the C++ jobs; keep the kernel OOM killer as the only
          # limit (systemd-oomd can kill on swap pressure before memory runs out).
          sudo systemctl stop systemd-oomd.service systemd-oomd.socket 2>/dev/null || true
          sudo swapoff -a || true
          sudo fallocate -l 40G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -g
          df -h /nix "$GITHUB_WORKSPACE" || df -h
      - name: Fetch pinned sources with verification and rate-limit backoff
        env:
          PACKAGE: ${{ matrix.package }}
        run: python3 scripts/prefetch-sources.py "$PACKAGE"
      - name: Build the pinned Aurora hardware package
        run: nix build --max-jobs 1 --cores ${{ matrix.package == 'firefox' && 3 || 4 }} --print-build-logs --json '.#packages.aarch64-linux.${{ matrix.package }}^*' > build.json
      - name: Exercise graphics generation switch and rollback
        if: matrix.package == 'graphics'
        run: |
          git fetch origin main
          nix shell --inputs-from . nixpkgs#clinfo nixpkgs#vulkan-tools -c bash scripts/test-graphics-generation "$(git rev-parse origin/main)"
      - name: Record output identity and closure
        run: |
          mapfile -t outputs < <(jq -r '.[].outputs[]' build.json)
          nix path-info --json --recursive "${outputs[@]}" > closure.json
          nix store verify --recursive "${outputs[@]}"
      # Build jobs never see the cache key: the export is unsigned, and the
      # publisher signs only metadata it has verified (publish-cache.yml).
      - name: Export an unsigned candidate cache
        if: github.event_name != 'pull_request'
        run: |
          mapfile -t outputs < <(jq -r '.[].outputs[]' build.json)
          bash scripts/export-cache "$PWD/cache" "${outputs[@]}"
          nix store verify --store "file://$PWD/cache" --all --no-trust
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: nix-${{ matrix.package }}-closure
          path: |
            build.json
            closure.json
            graphics-generation/*.txt
            graphics-generation/*.sha256
            cache/
      # Provenance for the exact artifact bytes; publication verifies it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: success() && github.event_name != 'pull_request'
        with:
          subject-name: nix-${{ matrix.package }}-closure.zip
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      # A failed attempt keeps its log under a name publication never reads, so
      # a re-run cannot leave an empty artifact beside the real one.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: failed-nix-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: |
            build.json
            closure.json
            graphics-generation/*.txt
            graphics-generation/*.sha256
          if-no-files-found: ignore
          retention-days: 14
