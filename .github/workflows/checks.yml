name: Aurora NixOS checks and builds
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated hardware outputs; empty builds all
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  evaluate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check incremental cache publication
        run: python3 -m unittest discover -s tests
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://aurorasilicon.org/nixos-aurora/cache
            extra-trusted-public-keys = aurora-nixos-1:ZxmPNEWsrzgXai+W+dlTE8cachb1xaatfXKK8X8go14=
      - id: plan
        name: Select changed derivations from committed Git flakes
        run: python3 scripts/ci-plan.py >> "$GITHUB_OUTPUT"
      - name: Evaluate all profiles and hardware packages
        run: |
          nix flake check --no-build
          nix build --no-link .#checks.aarch64-linux.profiles .#checks.aarch64-linux.firstboot-image .#checks.aarch64-linux.sep-kernel-transition \
            .#checks.aarch64-linux.stage2-tools .#checks.aarch64-linux.fedora-parity
      - name: Inspect KDE graphical login configuration
        run: |
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.defaultUnit
          nix eval --json .#nixosConfigurations.aurora-kde.config.services.displayManager.sddm.enable
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.services.display-manager.wantedBy
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.services.display-manager.after
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.services.display-manager.requires
          nix eval --json .#nixosConfigurations.aurora-kde.config.systemd.services.display-manager.unitConfig.ConditionPathExists
          nix eval --json .#nixosConfigurations.aurora-kde.config.boot.blacklistedKernelModules
          nix eval --json .#nixosConfigurations.aurora-kde.config.boot.initrd.availableKernelModules
  fex-overlay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix build --no-link --print-build-logs .#checks.aarch64-linux.fex-overlay-upgrade
  hardware:
    needs: evaluate
    if: needs.evaluate.outputs.packages != '[]'
    # Guest drivers contain x86 code and must be built on x86, as on Fedora.
    runs-on: ${{ matrix.package == 'fex-mesa' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.evaluate.outputs.packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-experimental-features = auto-allocate-uids cgroups
            auto-allocate-uids = true
            use-cgroups = true
            extra-system-features = uid-range
            extra-substituters = https://aurorasilicon.org/nixos-aurora/cache
            extra-trusted-public-keys = aurora-nixos-1:ZxmPNEWsrzgXai+W+dlTE8cachb1xaatfXKK8X8go14=
      - name: Check isolated Flatpak build namespaces before fetching SDKs
        if: matrix.package == 'flatpak-gl'
        run: nix build --no-link --print-build-logs .#checks.aarch64-linux.flatpak-sandbox
      - name: Fetch pinned sources with verification and rate-limit backoff
        env:
          PACKAGE: ${{ matrix.package }}
        run: python3 scripts/prefetch-sources.py "$PACKAGE"
      - name: Build the pinned Aurora hardware package
        run: nix build --max-jobs 1 --cores 4 --print-build-logs --json '.#packages.aarch64-linux.${{ matrix.package }}^*' > build.json
      - name: Exercise graphics generation switch and rollback
        if: matrix.package == 'graphics'
        run: |
          git fetch origin main
          nix shell --inputs-from . nixpkgs#clinfo nixpkgs#vulkan-tools -c bash scripts/test-graphics-generation "$(git rev-parse origin/main)"
      - name: Record output identity and closure
        run: |
          mapfile -t outputs < <(jq -r '.[].outputs[]' build.json)
          nix path-info --json --recursive "${outputs[@]}" > closure.json
          nix store verify --recursive "${outputs[@]}"
      # Build jobs never see the cache key: the export is unsigned, and the
      # publisher signs only metadata it has verified (publish-cache.yml).
      - name: Export an unsigned candidate cache
        if: github.event_name != 'pull_request'
        run: |
          mapfile -t outputs < <(jq -r '.[].outputs[]' build.json)
          bash scripts/export-cache "$PWD/cache" "${outputs[@]}"
          nix store verify --store "file://$PWD/cache" --all --no-trust
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: nix-${{ matrix.package }}-closure
          path: |
            build.json
            closure.json
            graphics-generation/*.txt
            graphics-generation/*.sha256
            cache/
      # Provenance for the exact artifact bytes; publication verifies it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: success() && github.event_name != 'pull_request'
        with:
          subject-name: nix-${{ matrix.package }}-closure.zip
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      # A failed attempt keeps its log under a name publication never reads, so
      # a re-run cannot leave an empty artifact beside the real one.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: failed-nix-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: |
            build.json
            closure.json
            graphics-generation/*.txt
            graphics-generation/*.sha256
          if-no-files-found: ignore
          retention-days: 14
