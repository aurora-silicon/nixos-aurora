name: Aurora NixOS checks and builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  evaluate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate all profiles and hardware packages
        run: |
          nix flake check --no-build
          nix build --no-link .#checks.aarch64-linux.profiles
  hardware:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: [aura, uboot, kernel, mesa, speakerguardd, aurora-bless]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build the pinned Aurora hardware package
        run: nix build --max-jobs 1 --cores 4 --print-build-logs '.#${{ matrix.package }}'
      - name: Record output identity and closure
        run: |
          nix path-info --json --recursive ./result > closure.json
          nix store verify ./result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-${{ matrix.package }}-closure
          path: closure.json
