name: Publish signed installer payload
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [nixos-minimal, nixos-kde, nixos-gnome]
        default: nixos-minimal
      image-run:
        description: Successful Native image workflow run ID
        required: true
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
jobs:
  delivery:
    uses: aurora-silicon/aurora-distributions/.github/workflows/build-payload.yml@3b5f0cc8ac0255324510813b42c8e712702beac1
    with:
      profile: ${{ inputs.profile }}
      image-run: ${{ inputs.image-run }}
    # The catalog key comes from this repository's catalog-signing
    # environment, which the reusable workflow's signing job runs in.
    secrets:
      INSTALLER_CATALOG_SIGNING_KEY: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY }}
