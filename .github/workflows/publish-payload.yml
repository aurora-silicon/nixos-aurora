name: Publish signed installer payload
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [nixos-minimal, nixos-kde, nixos-gnome]
        default: nixos-minimal
      image-run:
        description: Successful Native image workflow run ID
        required: true
permissions:
  contents: write
  actions: read
jobs:
  delivery:
    uses: aurora-silicon/aurora-distributions/.github/workflows/build-payload.yml@80821309ea2d73d5beab37cf18b3b0972838cd15
    with:
      profile: ${{ inputs.profile }}
      image-run: ${{ inputs.image-run }}
    secrets:
      catalog-signing-key: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY }}
