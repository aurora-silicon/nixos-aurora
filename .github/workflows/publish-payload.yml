name: Publish signed installer payload
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [nixos-minimal, nixos-kde, nixos-gnome]
        default: nixos-minimal
      image-run:
        description: Successful Native image workflow run ID
        required: true
      delivery-revision:
        description: Optional models58 refresh of the verified legacy-audio delivery
        type: string
        default: ''
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
jobs:
  delivery:
    uses: aurora-silicon/aurora-distributions/.github/workflows/build-payload.yml@69178da4caa503e69a44bda5dd4fe91f12c50cb8
    with:
      profile: ${{ inputs.profile }}
      image-run: ${{ inputs.image-run }}
      delivery-revision: ${{ inputs.delivery-revision || '' }}
    # The catalog key comes from this repository's catalog-signing
    # environment, which the reusable workflow's signing job runs in.
    secrets:
      INSTALLER_CATALOG_SIGNING_KEY: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY }}
