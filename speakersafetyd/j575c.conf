# Mac Studio M4 Max (J575c): speakersafetyd 2.0.1 apple/j575.conf with the
# J575c sense layout. The J575c speaker card is the AOP speaker stream (the
# J616s frame): its sense PCM carries twelve 16-bit channels, of which the
# one SN012776 sends its current on channel 0 and its voltage on channel 1
# (ti,imon-slot-no 0 and ti,vmon-slot-no 2 in 8-bit units). Every model
# value is j575.conf's (the Mac Studio enclosure and speaker, as j375 and
# j475), unchanged; only "channels" differs.
[Globals]
visense_pcm = 2
t_ambient = 46.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = False
uclamp_max = 64

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

[Speaker/Mono]
group = 0
tr_coil = 40.00
tr_magnet = 60.00
tau_coil = 3.70
tau_magnet = 250.00
t_limit = 140.0
t_headroom = 40.0
z_nominal = 4.60
a_t_20c = 0.0037
a_t_35c = 0.0037
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1
