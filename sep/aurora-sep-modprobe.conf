# The SEP driver's defaults: xART writes and first-boot keybag provisioning on.
# kmod reads modprobe.d by file name and the last value wins, so a read-only
# "options apple_sep xart_writes=0 provision_keybag=0" in
# /etc/modprobe.d/aurora-sep.conf or boot.extraModprobeConfig (nixos.conf)
# overrides these.
options apple_sep xart_writes=1 provision_keybag=1
