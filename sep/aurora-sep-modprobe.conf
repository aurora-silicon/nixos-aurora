# The SEP driver's defaults: xART writes and first-boot keybag provisioning on.
# modules/sep.nix copies this file to /run/modprobe.d/aurora-sep.conf at boot.
# /etc/modprobe.d/aurora-sep.conf replaces it there (kmod takes a file name
# from /etc before /run), so a read-only install sets
# environment.etc."modprobe.d/aurora-sep.conf".text to
# "options apple_sep xart_writes=0 provision_keybag=0". Not
# boot.extraModprobeConfig: nixos.conf would give each parameter a second
# value, and the kernel then does not load apple_sep. On the M5 Pro and Max
# (T6050) aurora-sep-load replaces the copy with those read-only options, and
# the owner opts in to writes with the /etc file (see XART-SAFETY.md).
options apple_sep xart_writes=1 provision_keybag=1
