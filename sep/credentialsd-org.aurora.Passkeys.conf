# aurora-fido's per-user passkey agent (aurora-passkeyd) as a credentialsd
# platform provider: Touch ID passkeys, keys in the Secure Enclave.
# Without a running agent credentialsd leaves it out of the device list.
[Provider]
Name=Aurora Passwords
BusName=org.aurora.Passkeys1
ObjectPath=/org/aurora/Passkeys1
Interface=org.aurora.Passkeys.Provider1
Transport=internal
