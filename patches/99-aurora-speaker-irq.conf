# Built-in speakers on the MCA transport (M1, M2 and M3 families) and the J616: the speaker PCM
# wakes PipeWire on its period interrupts, the audio clock, instead of on timers.
#
# A timer-scheduled ALSA sink paces itself on CLOCK_MONOTONIC, and chrony slews
# that clock (up to 8.3 % per second, every boot around 15-20 s after start and on
# later NTP corrections). While it slews, the sink under/overruns and is
# re-prepared about every 0.6 s, an audible dropout each time. With period
# interrupts the sink follows the hardware and a slew does nothing.
#
# Matched: the MCA speaker PCM (PCM 1 of the speaker card) of the M1, M2 and M3
# families, and the J616 (MacBook Pro 16-inch M4 Pro/Max), whose AOP speaker
# service is a cyclic ADMAC channel with an interrupt per period (proven on a
# J616s: 94/s for 512-frame periods; a forced slew re-prepared its timer-
# scheduled sink 7 times, 0 with period interrupts). Other AOP speaker Macs
# (M4 and later, the MacBook Neo) are not listed until probed.
monitor.alsa.rules = [
    {
        matches = [
            { api.alsa.path = "~^hw:AppleJ(274|293|313|456|457|314|316|375|413|415|473|493|414|416|474|475|180|504|514|516|433|434|613|615|616),1$" }
        ]
        actions = {
            update-props = {
                api.alsa.disable-tsched = true
            }
        }
    }
]
