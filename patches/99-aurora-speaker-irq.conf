# Built-in speakers: the speaker PCM (PCM 1 of every macaudio card, named
# AppleJ<board>) wakes PipeWire on its period interrupts, the audio clock,
# instead of on timers.
#
# A timer-scheduled ALSA sink paces itself on CLOCK_MONOTONIC, and chrony slews
# that clock (up to 8.3 % per second, every boot around 15-20 s after start and on
# later NTP corrections). While it slews, the sink under/overruns and is
# re-prepared about every 0.6 s, an audible dropout each time. With period
# interrupts the sink follows the hardware and a slew does nothing.
#
# Every macaudio speaker front-end is a cyclic DMA PCM that completes one
# period per interrupt, whichever transport feeds the amps: the MCA on the M1,
# M2 and M3 families, the AOP speaker services from the M4 on (sound/soc/apple:
# mca.c, aop_spkr.rs, aop_audio.rs, aop_t8140.rs, t8152_aop_audio.rs). Proven
# on a J616s: 94 interrupts/s for 512-frame periods; a forced slew re-prepared
# its timer-scheduled sink 7 times, 0 with period interrupts. The microphone
# and jack cards (AppleJ<board>HPAI, AppleJ<board>AOP) are not matched.
monitor.alsa.rules = [
    {
        matches = [
            { api.alsa.path = "~^hw:AppleJ[0-9]+[a-z]?,1$" }
        ]
        actions = {
            update-props = {
                api.alsa.disable-tsched = true
            }
        }
    }
]
